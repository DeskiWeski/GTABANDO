const CG=200,cgW=Math.ceil(WW/CG)+1,cgH=Math.ceil(WH/CG)+1,cgrid=new Array(cgW*cgH);for(let i=0;i<cgrid.length;i++)cgrid[i]=[];
solids.forEach(s=>{const x0=Math.max(0,Math.floor(s.x/CG)),x1=Math.min(cgW-1,Math.floor((s.x+s.w)/CG)),y0=Math.max(0,Math.floor(s.y/CG)),y1=Math.min(cgH-1,Math.floor((s.y+s.h)/CG));for(let gy=y0;gy<=y1;gy++)for(let gx=x0;gx<=x1;gx++)cgrid[gy*cgW+gx].push(s);});
function solidsNear(x,y,r){const out=[],x0=Math.max(0,Math.floor((x-r)/CG)),x1=Math.min(cgW-1,Math.floor((x+r)/CG)),y0=Math.max(0,Math.floor((y-r)/CG)),y1=Math.min(cgH-1,Math.floor((y+r)/CG));for(let gy=y0;gy<=y1;gy++)for(let gx=x0;gx<=x1;gx++){const c=cgrid[gy*cgW+gx];for(let i=0;i<c.length;i++){const s=c[i];if(out.indexOf(s)<0)out.push(s);}}return out;}
// circle vs boxes; returns {x,y,hit,nx,ny} pushed out
function pushOut(x,y,r,fly){let hit=false,nx=0,ny=0;const ss=solidsNear(x,y,r+4);for(let k=0;k<ss.length;k++){const s=ss[k];if(fly&&s.k==='w')continue;
    const cx=clamp(x,s.x,s.x+s.w),cy=clamp(y,s.y,s.y+s.h);let dx=x-cx,dy=y-cy,d2=dx*dx+dy*dy;
    if(d2<r*r){if(d2<1e-6){const l=x-s.x,rr_=s.x+s.w-x,t=y-s.y,b=s.y+s.h-y,m=Math.min(l,rr_,t,b);if(m===l){x=s.x-r;nx=-1;}else if(m===rr_){x=s.x+s.w+r;nx=1;}else if(m===t){y=s.y-r;ny=-1;}else{y=s.y+s.h+r;ny=1;}hit=true;continue;}
      const d=Math.sqrt(d2),pu=r-d;x+=dx/d*pu;y+=dy/d*pu;nx+=dx/d;ny+=dy/d;hit=true;}}
  return{x,y,hit,nx,ny};}
function isWater(x,y){const ss=solidsNear(x,y,2);for(const s of ss)if(s.k==='w'&&x>=s.x&&x<=s.x+s.w&&y>=s.y&&y<=s.y+s.h)return true;return false;}

  const ends=[];
  HR.forEach((h,hi)=>{const row=NODES.filter(n=>n.hi===hi&&n.vi>=0).sort((a,b)=>a.x-b.x);const e0={x:60,y:h.y,hi,vi:-1,adj:[]},e1={x:WW-60,y:h.y,hi,vi:-2,adj:[]};ends.push(e0,e1);const all=[e0].concat(row,[e1]);

    let nb=null,nd=1e9;HR.forEach(r=>{const d=Math.abs(y-r.y);if(d<nd){nd=d;nb=r;}});VR.forEach(r=>{if(y<r.y0||y>r.y1)return;const d=Math.abs(x-r.x);if(d<nd){nd=d;nb=r;}});best={n:nb?nb.name:'SURFSIDE',id:nb?nb.id:'',h:nb&&nb.y!==undefined,near:1};}

function camApply(dt,px,py,pz,look){CAM.tx=px+(look?look.x:0);CAM.ty=py+(look?look.y:0);CAM.tz=pz;CAM.x=damp(CAM.x,CAM.tx,5,dt);CAM.y=damp(CAM.y,CAM.ty,5,dt);CAM.z=damp(CAM.z,CAM.tz,2.4,dt);if(CAM.shake>0)CAM.shake=Math.max(0,CAM.shake-dt*30);}

function camEnd(){ctx.restore();}
function visRect(m){const hw=W/2/CAM.z+(m||0),hh=H/2/CAM.z+(m||0);return{x0:CAM.x-hw,y0:CAM.y-hh,x1:CAM.x+hw,y1:CAM.y+hh};}
function w2s(x,y){return{x:(x-CAM.x)*CAM.z+W/2,y:(y-CAM.y)*CAM.z+H/2};}
function s2w(x,y){return{x:(x-W/2)/CAM.z+CAM.x,y:(y-H/2)/CAM.z+CAM.y};}
function drawGround(t){const v=visRect(40);const tx0=Math.max(0,Math.floor(v.x0/TILE)),tx1=Math.min(Math.floor(WW/TILE),Math.floor(v.x1/TILE)),ty0=Math.max(0,Math.floor(v.y0/TILE)),ty1=Math.min(Math.floor(WH/TILE),Math.floor(v.y1/TILE));
  ctx.fillStyle='#02060e';ctx.fillRect(v.x0-50,v.y0-50,v.x1-v.x0+100,v.y1-v.y0+100);
  for(let ty=ty0;ty<=ty1;ty++)for(let tx=tx0;tx<=tx1;tx++)ctx.drawImage(getTile(tx,ty),tx*TILE,ty*TILE);
  // animated water: shimmering lake and river
  ctx.save();ctx.beginPath();ctx.rect(Math.max(v.x0,0),Math.max(v.y0,0),v.x1-v.x0,Math.max(0,Math.min(300,v.y1)-Math.max(v.y0,0)));ctx.clip();
  const ya=Math.max(0,Math.floor(v.y0/26)),yb=Math.min(11,Math.ceil(Math.min(300,v.y1)/26));
  for(let j=ya;j<=yb;j++){const y=j*26;ctx.strokeStyle='rgba(150,200,255,'+(.05+.04*Math.sin(t+j))+')';ctx.lineWidth=2;ctx.beginPath();for(let x=Math.floor(v.x0/40)*40;x<v.x1+40;x+=40){const yy=y+Math.sin(x*.02+t*1.4+j*1.7)*3;if(x===Math.floor(v.x0/40)*40)ctx.moveTo(x,yy);else ctx.lineTo(x,yy);}ctx.stroke();}
  // moon glitter
  ctx.fillStyle=rg(2230,120,0,260,[[0,'rgba(200,225,255,.26)'],[1,'rgba(200,225,255,0)']]);ctx.fillRect(1900,0,700,300);
  ctx.restore();
  // beach surf line
  ctx.strokeStyle='rgba(220,240,255,.4)';ctx.lineWidth=3;ctx.beginPath();for(let x=Math.floor(v.x0/30)*30;x<v.x1+30;x+=30){const yy=300+Math.sin(x*.03+t*1.1)*3.5;if(x===Math.floor(v.x0/30)*30)ctx.moveTo(x,yy);else ctx.lineTo(x,yy);}if(v.y0<320)ctx.stroke();
  // river flow
  if(v.x1>RIVER.x0&&v.x0<RIVER.x1){ctx.save();ctx.beginPath();ctx.rect(RIVER.x0,300,RIVER.x1-RIVER.x0,SOUTH-300);ctx.clip();for(let y=Math.floor(v.y0/36)*36;y<v.y1;y+=36){ctx.strokeStyle='rgba(160,210,255,.12)';ctx.lineWidth=2;ctx.beginPath();const o=(t*30+y*.7)%100;ctx.moveTo(RIVER.x0+10+((o+y)%80),y);ctx.lineTo(RIVER.x0+30+((o+y)%80),y+10);ctx.stroke();}ctx.restore();}
}

/* ---------- night lighting (light map punched with lamps and headlights) ---------- */
const LM=document.createElement('canvas');LM.width=480;LM.height=270;const lmx=LM.getContext('2d');
function nightness(clock){// clock in minutes since 23:00 -> 0..420
  const m=clock;if(m<300)return .74;if(m>=420)return .02;return lerp(.74,.02,clamp((m-300)/110,0,1));}
function lightPass(ents,clock,t){const a=nightness(clock);if(a<.04)return;
  withCtx(lmx,()=>{lmx.setTransform(1,0,0,1,0,0);lmx.globalCompositeOperation='source-over';lmx.clearRect(0,0,480,270);lmx.fillStyle='rgba(3,6,20,'+a+')';lmx.fillRect(0,0,480,270);lmx.globalCompositeOperation='destination-out';
    const k=.5*CAM.z,hole=(x,y,r,al)=>{const s=w2s(x,y);const X=s.x*.5,Y=s.y*.5,R=r*k;if(X<-R||X>480+R||Y<-R||Y>270+R)return;const g=lmx.createRadialGradient(X,Y,0,X,Y,R);g.addColorStop(0,'rgba(0,0,0,'+al+')');g.addColorStop(.55,'rgba(0,0,0,'+al*.5+')');g.addColorStop(1,'rgba(0,0,0,0)');lmx.fillStyle=g;lmx.beginPath();lmx.arc(X,Y,R,0,7);lmx.fill();};
    const v=visRect(300);lamps.forEach(l=>{if(l.x>v.x0&&l.x<v.x1&&l.y>v.y0&&l.y<v.y1)hole(l.x,l.y,150,.82);});
    Object.values(PLACES).forEach(p=>{if(p.park||p.id==='pier')return;if(p.x>v.x0-200&&p.x<v.x1&&p.y>v.y0-200&&p.y<v.y1)hole(p.x+p.w/2,p.y+p.h+14,Math.max(90,p.w*.7),.7);});
    hole(2230,330,170,.6);
    ents.forEach(e=>{if(e.beams){const s=w2s(e.x,e.y),X=s.x*.5,Y=s.y*.5,R=240*k;lmx.save();lmx.translate(X,Y);lmx.rotate(e.ang);const g=lmx.createLinearGradient(0,0,R,0);g.addColorStop(0,'rgba(0,0,0,.95)');g.addColorStop(1,'rgba(0,0,0,0)');lmx.fillStyle=g;lmx.beginPath();lmx.moveTo(10*k,-7*k);lmx.lineTo(R,-R*.42);lmx.lineTo(R,R*.42);lmx.lineTo(10*k,7*k);lmx.closePath();lmx.fill();lmx.restore();hole(e.x,e.y,64,.55);}
      if(e.glow)hole(e.x,e.y,e.glow,.7);});
    lmx.globalCompositeOperation='source-over';});
  ctx.save();ctx.imageSmoothingEnabled=true;ctx.drawImage(LM,0,0,W,H);ctx.restore();
  // warm lamp glow on top (additive), clipped to what is on screen
  const v=visRect(100);ctx.save();ctx.globalCompositeOperation='lighter';lamps.forEach(l=>{if(l.x>v.x0&&l.x<v.x1&&l.y>v.y0&&l.y<v.y1){const s=w2s(l.x,l.y);const r=90*CAM.z;const g=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,r);g.addColorStop(0,'rgba(255,170,80,'+(.2*a)+')');g.addColorStop(1,'rgba(255,170,80,0)');ctx.fillStyle=g;ctx.fillRect(s.x-r,s.y-r,r*2,r*2);}});ctx.restore();}

/* ============ ENTITY RENDERING (top-down) ============ */
function hexA(c){if(c[0]==='r'){return c.match(/\d+/g).slice(0,3).map(Number);}c=c.replace('#','');if(c.length===3)c=c.split('').map(x=>x+x).join('');return[parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)];}
function mixc(a,b,t){const A=hexA(a),B=hexA(b);return'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')+')';}
const lit=(c,t)=>mixc(c,'#ffffff',t),drk=(c,t)=>mixc(c,'#000000',t);

/* ---------- cars ---------- */
function drawCar(c,t){const L=c.len,Wd=c.wid;ctx.save();ctx.translate(c.x,c.y);
  // shadow
  ctx.save();ctx.rotate(c.ang);ctx.fillStyle='rgba(0,0,0,.35)';rr(-L/2+3,-Wd/2+5,L,Wd,7);ctx.fill();ctx.restore();
  ctx.rotate(c.ang);
  const dead=c.dead,base=dead?'#2a2a2e':c.col;
  if(c.wob){ctx.rotate(Math.sin(t*30)*c.wob);}
  if(c.type==='bike'){ctx.fillStyle='#0b0b0d';rr(-L/2,-3,9,6,3);ctx.fill();rr(L/2-9,-3,9,6,3);ctx.fill();ctx.fillStyle=dead?'#222':c.col;rr(-L/2+6,-4,L-14,8,4);ctx.fill();ctx.fillStyle='#222';ctx.fillRect(L/2-12,-7,3,14);ctx.fillStyle='#fff6c8';ctx.fillRect(L/2-2,-2,3,4);ctx.restore();return;}
  // wheels
  ctx.fillStyle='#0b0b0d';[[.3,-1],[.3,1],[-.3,-1],[-.3,1]].forEach(w=>{rr(L*w[0]-5,w[1]*Wd/2-(w[1]>0?0:3)-1,10,4,1.5);ctx.fill();});
  // body
  const g=lg(0,-Wd/2,0,Wd/2,[[0,lit(base,.25)],[.5,base],[1,drk(base,.3)]]);
  ctx.fillStyle=g;rr(-L/2,-Wd/2,L,Wd,c.type==='tomb'||c.type==='van'||c.type==='pickup'?4:9);ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.55)';ctx.lineWidth=1.5;ctx.stroke();
  // pickup bed / van / tomb truck details
  if(c.type==='pickup'||c.type==='tomb'){ctx.fillStyle=drk(base,.35);rr(-L/2+3,-Wd/2+3,L*.42,Wd-6,2);ctx.fill();ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(-L/2+5,-Wd/2+5,L*.38,Wd-10);}
  if(c.type==='van'){ctx.fillStyle=lit(base,.12);rr(-L/2+3,-Wd/2+3,L*.62,Wd-6,3);ctx.fill();}
  // cabin / windows
  const cx0=c.type==='van'?L*.1:c.type==='pickup'||c.type==='tomb'?L*.02:-L*.08,cw=c.type==='van'?L*.34:L*.34;
  ctx.fillStyle=dead?'#111':'rgba(20,32,52,.92)';rr(cx0-cw/2+2,-Wd/2+3.5,cw,Wd-7,4);ctx.fill();
  ctx.fillStyle='rgba(160,200,235,.35)';ctx.beginPath();ctx.moveTo(cx0+cw/2-1,-Wd/2+4);ctx.lineTo(cx0+cw/2-7,-Wd/2+4);ctx.lineTo(cx0+cw/2-3,Wd/2-4);ctx.lineTo(cx0+cw/2+1,Wd/2-4);ctx.fill();
  // roof highlight
  ctx.fillStyle='rgba(255,255,255,.12)';rr(cx0-cw/2+6,-Wd/2+6,cw-8,Wd-12,3);ctx.fill();
  if(c.type==='regal'&&!dead){ctx.fillStyle='rgba(255,122,0,.9)';ctx.fillRect(L*.12,-1.5,L*.34,3);ctx.fillStyle='rgba(20,20,20,.8)';ctx.fillRect(L*.12,-5,L*.34,1.2);ctx.fillRect(L*.12,3.8,L*.34,1.2);}
  if(c.type==='lukey'&&!dead){ctx.fillStyle='#ffd23f';ctx.fillRect(-L*.45,-1.5,L*.9,3);ctx.fillStyle='#111';ctx.fillRect(L*.1,-Wd/2+1,3,Wd-2);}
  if(c.type==='tomb'&&!dead){ctx.fillStyle='#ffd23f';text(GM.story&&GM.story.named.tomb?'TOM B':'',L*.18,3,9,'#ffd23f','center',{f:FD,sh:false});ctx.fillStyle='#b32';ctx.fillRect(L/2-6,-Wd/2+2,5,Wd-4);}
  // cop
  if(c.type==='cop'&&!dead){ctx.fillStyle='#f0f0f4';rr(-L/2+2,-Wd/2+2,L*.28,Wd-4,3);ctx.fill();ctx.fillRect(L*.22,-Wd/2+2,L*.18,Wd-4);ctx.fillStyle='#0b0e1a';rr(-L*.2,-Wd/2+1,6,Wd-2,2);ctx.fill();
    if(c.siren){const f=Math.floor(t*9)%2;ctx.fillStyle=f?'#ff2a2a':'#2a6aff';ctx.fillRect(-L*.2+1,-Wd/2+2,4,Wd/2-2);ctx.fillStyle=f?'#2a6aff':'#ff2a2a';ctx.fillRect(-L*.2+1,0,4,Wd/2-2);}else{ctx.fillStyle='#444';ctx.fillRect(-L*.2+1,-Wd/2+2,4,Wd-4);}}
  // lights
  const hb=(c.beams||c.driver==='player')&&!dead;
  ctx.fillStyle=hb?'#fff6c8':'#b9b36f';ctx.fillRect(L/2-3,-Wd/2+2,3,5);ctx.fillRect(L/2-3,Wd/2-7,3,5);
  const br=c.ctl&&c.ctl.thr<0||c.ctl&&c.ctl.hb;ctx.fillStyle=br?'#ff4040':'#8a1c1c';ctx.fillRect(-L/2,-Wd/2+2,3,5);ctx.fillRect(-L/2,Wd/2-7,3,5);
  if(c.flashT>0){ctx.fillStyle='rgba(255,255,255,'+c.flashT*4+')';rr(-L/2,-Wd/2,L,Wd,8);ctx.fill();c.flashT-=1/60;}
  // damage scuffs
  if(!dead&&c.hp<c.maxhp*.6){ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.arc(L*.3,-4,5,0,7);ctx.arc(-L*.25,5,4,0,7);ctx.fill();}
  ctx.restore();
  if(c.burn&&!c.tombWreck||c.smoke){if(Math.random()<.5)GM.fx.push({k:'smoke',x:c.x+rnd(-8,8),y:c.y+rnd(-8,8),vx:rnd(-10,10),vy:rnd(-40,-15),life:rnd(.7,1.4),t:0,r:rnd(5,10),col:dead?'#2a2a2a':'#8a8a8a'});if(dead&&Math.random()<.35)GM.fx.push({k:'fire',x:c.x+rnd(-14,14),y:c.y+rnd(-10,10),vx:0,vy:-30,life:.5,t:0,r:rnd(5,9)});}
  if(c.tomb&&c.hp<c.maxhp&&c.hunt){const w=60,x=c.x-w/2,y=c.y-c.len*.5-20;ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(x-1,y-1,w+2,7);ctx.fillStyle=c.hunt.kind==='lukey'?'#ffd23f':'#ff7a00';ctx.fillRect(x,y,w*clamp(c.hp/c.maxhp,0,1),5);}
}

  ctx.restore();});}
function drawFx(t,dt){const F=GM.fx;for(let i=F.length-1;i>=0;i--){const f=F[i];f.t+=dt;if(f.t>=f.life){F.splice(i,1);continue;}const k=f.t/f.life;
  if(f.vx!==undefined){f.x+=f.vx*dt;f.y+=f.vy*dt;if(f.k!=='text'){f.vx*=Math.exp(-3*dt);f.vy*=Math.exp(-3*dt);}}
  if(f.k==='text'){f.y+=f.vy*dt;ctx.save();ctx.globalAlpha=1-k*k;text(f.s,f.x,f.y,f.size,f.col,'center',{f:FB,w:'700',sp:1,mw:260});ctx.restore();}
  else if(f.k==='spark'||f.k==='glass'){ctx.fillStyle=f.col;ctx.globalAlpha=1-k;ctx.fillRect(f.x-f.r/2,f.y-f.r/2,f.r,f.r);ctx.globalAlpha=1;}
  else if(f.k==='blood'){ctx.fillStyle=f.col;ctx.globalAlpha=1-k;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,7);ctx.fill();ctx.globalAlpha=1;}
  else if(f.k==='smoke'){ctx.fillStyle=f.col||'#999';ctx.globalAlpha=(1-k)*.4;ctx.beginPath();ctx.arc(f.x,f.y,f.r*(1+k*1.6),0,7);ctx.fill();ctx.globalAlpha=1;}
  else if(f.k==='fire'){glow(f.x,f.y,f.r*3,'#ff7a2a',.8*(1-k));ctx.fillStyle='rgba(255,'+Math.floor(220-k*160)+',40,'+(1-k)+')';ctx.beginPath();ctx.arc(f.x,f.y,f.r*(1-k*.6),0,7);ctx.fill();}
  else if(f.k==='boom'){const R=f.R*(.4+k*.9);glow(f.x,f.y,R*1.6,f.col||'#ffb347',1-k);ctx.strokeStyle='rgba(255,240,200,'+(1-k)+')';ctx.lineWidth=6*(1-k);ctx.beginPath();ctx.arc(f.x,f.y,R,0,7);ctx.stroke();}}}
function drawHeli(t){const h=GM.heli;if(!h)return;ctx.save();ctx.translate(h.x+30,h.y+60);ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(0,0,26,12,0,0,7);ctx.fill();ctx.restore();

function interact(){const G=GM,p=G.p,st=G.story;if(G.phone){phoneAct();return;}

  const T=G.hunters[0];if(T.mode==='winded'&&Math.hypot(T.foot.x-p.x,T.foot.y-p.y)<110){st.talk('tomb');return;}

  for(const k of Object.keys(EVID)){if(st.ev[k])continue;const E=EVID[k];if(Math.hypot(E.pos.x-p.x,E.pos.y-p.y)<85){st.physical(k);say([['sys','You search the '+EVID[k].name.toLowerCase()+'...'],['you','Got something.']],{});return;}}

/* ---------- per-frame update ---------- */
function playerControl(dt){const G=GM,p=G.p,k=IN.pressed;const key=n=>k[n]?1:0;
  let mx=key('d')+key('arrowright')-key('a')-key('arrowleft'),my=key('s')+key('arrowdown')-key('w')-key('arrowup');
  if(IN.stick){mx+=IN.stick.x;my+=IN.stick.y;}mx=clamp(mx,-1,1);my=clamp(my,-1,1);
  p.fireCD=Math.max(0,p.fireCD-dt);p.chordCD=Math.max(0,p.chordCD-dt);p.muzzle=Math.max(0,p.muzzle-dt);if(p.inv>0)p.inv-=dt;
  if(p.reload>0){p.reload-=dt;if(p.reload<=0){p.reload=0;p.ammo=MAG;Snd.ui();}}
  if(p.dead){G.downT+=dt;if(G.downT>2.4)respawn();return;}
  const c=p.inCar;
  if(c){p.x=c.x;p.y=c.y;p.vx=c.vx;p.vy=c.vy;
    c.ctl.thr=clamp(-my,-1,1);c.ctl.steer=clamp(mx,-1,1);c.ctl.hb=(k['shift']||IN.hb)?1:0;if(G.wash){c.ctl.thr=0;c.ctl.steer=0;c.ctl.hb=0;}
    p.aimAng=IN.usingMouse?Math.atan2(s2w(IN.mouse.x,IN.mouse.y).y-p.y,s2w(IN.mouse.x,IN.mouse.y).x-p.x):(IN.aimSet?IN.aim:c.ang);
    if(c.dead){exitCar(true);}
    Snd.engine(clamp(carSpeed(c)/c.maxv,0,1));}
  else{const sprint=k['shift']||IN.sprint;const sp=sprint?235:150;const L=Math.hypot(mx,my)||1;const tx=mx?mx/Math.max(1,L)*sp:0,ty=my?my/Math.max(1,L)*sp:0;
    p.vx=damp(p.vx,tx,14,dt);p.vy=damp(p.vy,ty,14,dt);p.x+=p.vx*dt;p.y+=p.vy*dt;const o=pushOut(p.x,p.y,9,false);p.x=o.x;p.y=o.y;
    // cars are solid
    for(const cc of G.cars){if(Math.abs(cc.x-p.x)>60||Math.abs(cc.y-p.y)>60)continue;for(const q of carPts(cc)){const dx=p.x-q[0],dy=p.y-q[1],d=Math.hypot(dx,dy),R=carRadius(cc)+8;if(d<R&&d>.01){p.x+=dx/d*(R-d);p.y+=dy/d*(R-d);}}}
    const moving=Math.hypot(p.vx,p.vy)>20;if(moving){p.face=Math.atan2(p.vy,p.vx);p.anim+=Math.hypot(p.vx,p.vy)*dt*.09;}
    if(IN.usingMouse){const w=s2w(IN.mouse.x,IN.mouse.y);p.aimAng=Math.atan2(w.y-p.y,w.x-p.x);}else if(IN.aimSet)p.aimAng=IN.aim;else if(moving)p.aimAng=damp(p.aimAng,p.aimAng+nrm(p.face-p.aimAng),20,dt);
    Snd.engine(-1);}
  if(IN.fire||k[' '])fireGun(p);
  if(IN.reloadEdge){IN.reloadEdge=0;startReload(p);}
  if(IN.chordEdge){IN.chordEdge=0;fireBlast(p);}
  // pierogi stands
  G.items.forEach(it=>{if(it.k!=='pierogi')return;if(it.cool>0){it.cool-=dt;return;}if(!p.inCar&&p.hp<p.maxhp&&Math.hypot(it.x-p.x,it.y-p.y)<30){p.hp=Math.min(p.maxhp,p.hp+40);it.cool=45;popText(p.x,p.y-30,'PIEROGI! +HP','#7aff9a',18);Snd.good();}});
}
function stepWorld(dt){const G=GM,p=G.p,st=G.story;
  G.clock+=dt*CLOCKRATE;if(G.clock>=420){gameOver('dawn');return;}
  if(st.phase==='intro'&&p.inCar===G.regal){st.phase='play';st.callT=4;pushNote('YOUR PHONE WILL RING WITH ORDERS. FOLLOW THE MAP TO THE DROP.','#ffd23f');}
  if(p.inCar===G.regal&&G.lastCar!==G.regal)tagline('hot');G.lastCar=p.inCar;G.tagT=Math.max(0,G.tagT-dt);
  if(G.regal.locked&&!G.cops.some(q=>q.guard&&!q.dead)){G.regal.locked=false;pushNote('THE GUARDS LEFT. THE REGAL IS UNLOCKED!','#7aff9a');}
  playerControl(dt);
  // cars
  const act=[];G.cars.forEach(c=>{
    if(c.driver==='player'){}
    else if(c.driver==='summon')summonDrive(c,dt);
    else if(c.type==='cop'&&c.ai&&c.driver!=='parked')copCarAI(c,dt);
    else if(c.driver==='ai'&&c.ai&&!c.bjCar)aiDrive(c,dt);
    if(c.hornT>0){if(c.hornT>.28)Snd.horn();c.hornT-=dt;}
    if(c.dead){c.deadT=(c.deadT||0)+dt;}
    const near=Math.abs(c.x-p.x)<1900&&Math.abs(c.y-p.y)<1500;const moving=c.vx*c.vx+c.vy*c.vy>16||c.driver!=='parked';
    if((near||c.driver==='summon')&&(moving||c.dead)){stepCar(c,dt);act.push(c);}});
  for(const a of act){for(const b of G.cars){if(a===b)continue;if(b.id<a.id&&act.includes(b))continue;carVsCar(a,b);}}
  // cars hitting people
  G.cars.forEach(c=>{const sp=carSpeed(c);if(sp<85||c.dead)return;const R=c.len*.5+4;
    G.peds.forEach(q=>{if(!q.dead&&Math.abs(q.x-c.x)<R+10&&Math.abs(q.y-c.y)<R+10&&carPts(c).some(pt=>Math.hypot(pt[0]-q.x,pt[1]-q.y)<c.wid*.65)){hurtPed(q,40+sp*.1,'car',c.driver==='player');q.vx=c.vx;q.vy=c.vy;if(c.driver==='player')Snd.hit();}});
    if(c.driver!=='player'&&!p.inCar&&!p.dead&&p.inv<=0&&carPts(c).some(pt=>Math.hypot(pt[0]-p.x,pt[1]-p.y)<c.wid*.6+6)){hurtPlayer(14+sp*.04,'ram');p.inv=.6;const a=Math.atan2(p.y-c.y,p.x-c.x);p.vx+=Math.cos(a)*300;p.vy+=Math.sin(a)*300;}});
  G.peds.forEach(q=>{if(Math.abs(q.x-p.x)<1200&&Math.abs(q.y-p.y)<900)stepPed(q,dt);else if(q.dead)q.deadT+=dt;});
  patrolCops(dt);
  populate(dt);
  updateBullets(dt);updateWanted(dt);updateSafe(dt);updateCops(dt);G.hunters.forEach(h=>updateHunter(h,dt));
  st.tick(dt);Mini.update(dt);
  if(!p.dead&&!G.finale0&&st.phase==='finale'&&st.finale&&st.finale.stage==='run'){const h=PLACES.hall,x=h.x+h.w/2,y=h.y+h.h+40;if(Math.hypot(p.x-x,p.y-y)<90)st.arriveHQ();}
  G.vig=Math.max(0,G.vig-dt*.5);
  // camera
  const c=p.inCar,sp=c?carSpeed(c):0;const z=c?clamp(1.08-sp/820,.72,1.08):1.2;const look=c?{x:c.vx*.28,y:c.vy*.28}:{x:Math.cos(p.aimAng)*40,y:Math.sin(p.aimAng)*40};
  camApply(dt,p.x,p.y,z,look);
}
function patrolCops(dt){const G=GM;G.patrolT-=dt;if(G.patrolT>0)return;G.patrolT=3;
  let n=0;G.cars.forEach(c=>{if(c.type==='cop'&&c.ai&&c.ai.mode==='patrol'&&!c.dead)n++;});
  G.cars=G.cars.filter(c=>{if(c.type==='cop'&&c.ai&&c.ai.mode==='patrol'&&Math.hypot(c.x-G.p.x,c.y-G.p.y)>2000&&!onScreen(c.x,c.y,200)){n--;return false;}if(c.type==='cop'&&c.ai&&c.ai.mode==='chase'&&G.wanted.lvl===0&&G.standdown<=0&&Math.hypot(c.x-G.p.x,c.y-G.p.y)>1500)return false;return true;});
  if(n<3&&G.wanted.lvl===0){const s=randomRoadSpot(600,1200);if(s&&!onScreen(s.x,s.y,60)){const c=mkCar('cop',s.x+(-Math.sin(s.ang))*24,s.y+Math.cos(s.ang)*24,s.ang,{driver:'cop',beams:true,col:'#1a1d2a'});c.ai={mode:'patrol',from:s.a,to:s.b,panic:0,spd:120,stuck:0};if(G.cars.every(o=>dist2(o,c)>80*80))G.cars.push(c);}}}

function update(dt){const G=GM;if(G.scene==='title'){return;}
  G.t+=dt;updateDlg(dt);G.notes.forEach(n=>n.t+=dt);G.notes=G.notes.filter(n=>n.t<6.5);
  if(G.over||G.paused)return;
  updatePhone(dt);
  if(G.nb||G.fmap||G.pmenu)return;
  if(G.cut||G.modal||G.dlg)return;
  if(G.pendingDlg&&!G.mini){say(G.pendingDlg);G.pendingDlg=null;return;}
  if(G.mini&&G.mini.kind==='riff'){Mini.update(dt);return;}
  if(G.frozen)return;
  stepWorld(dt);}

/* ---------- render ---------- */

  if(p.dead){ctx.fillStyle='rgba(0,0,0,'+Math.min(.7,G.downT*.5)+')';ctx.fillRect(0,0,W,H);text('WASTED',W/2,H/2,110,'#ff4a4a','center',{sp:8,alpha:Math.min(1,G.downT)});}
}
const TB={stick:{x:110,y:H-100,r:70},fire:{x:W-92,y:H-96,r:54},chord:{x:W-196,y:H-64,r:34},act:{x:W-70,y:H-206,r:38},spr:{x:W-190,y:H-150,r:32},rel:{x:W-262,y:H-124,r:26},phone:{x:290,y:114,r:22},nb:{x:346,y:114,r:22},map:{x:402,y:114,r:22}};

/* ---------- input ---------- */
function lpos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
function uiFree(){return GM.scene==='play'&&!GM.dlg&&!GM.modal&&!GM.cut&&!GM.nb&&!GM.paused&&!GM.over&&!GM.fmap&&!GM.pmenu;}
function inRect(p,r){return p.x>=r.x-3&&p.x<=r.x+r.w+3&&p.y>=r.y-3&&p.y<=r.y+r.h+3;}
function hitBtn(p){for(const b of BTN){if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){b.fn();return true;}}return false;}
function inCircle(p,o){return Math.hypot(p.x-o.x,p.y-o.y)<=o.r+16;}
const touches=new Map();
cv.addEventListener('pointerdown',e=>{e.preventDefault();Snd.init();const p=lpos(e);IN.mouse=p;
  if(GM.scene==='play'&&GM.phone&&!GM.dlg&&!GM.cut&&!GM.modal&&hitPhone(p))return;
  if(e.pointerType==='mouse'){IN.usingMouse=true;
    if(uiFree()&&!(GM.mini&&GM.mini.kind==='riff')&&inRect(p,MM)){openMap();return;}
    if(uiFree()&&!(GM.mini&&GM.mini.kind==='riff')){if(e.button===2){IN.chordEdge=1;}else{IN.fire=1;}}
    else if(GM.mini&&GM.mini.kind==='riff'&&uiFree()){riffTap(p);}
    else hitBtn(p);
    return;}
  IN.usingMouse=false;
  if(GM.mini&&GM.mini.kind==='riff'&&uiFree()){riffTap(p);return;}
  if(uiFree()){
    if(inRect(p,MM)){openMap();return;}
    if(inCircle(p,TB.phone)){openPmenu();return;}
    if(inCircle(p,TB.map)){openMap();return;}
    if(inCircle(p,TB.rel)){IN.reloadEdge=1;return;}
    if(inCircle(p,TB.fire)){touches.set(e.pointerId,'fire');IN.fire=1;IN.fireStart=p;return;}
    if(inCircle(p,TB.chord)){IN.chordEdge=1;return;}
    if(inCircle(p,TB.act)){interact();return;}
    if(inCircle(p,TB.nb)){openNB();return;}

    if(p.x<W*.5&&p.y>H*.3){touches.set(e.pointerId,'stick');IN.stickO=p;IN.stick={x:0,y:0};return;}

  if(k==='stick'){IN.stick=null;}else if(k==='fire'){IN.fire=0;IN.aimSet=false;}else if(k==='spr'){IN.sprint=0;IN.hb=0;}};

document.addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT')return;const k=e.key.toLowerCase();Snd.init();const G=GM;
  if(['arrowup','arrowdown','arrowleft','arrowright',' ','tab'].includes(k))e.preventDefault();

  IN.pressed[k]=true;});
